[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-aws-s3-connector"
version = "1.0.0"
description = "Conector Ruvic para gestión de objetos en Amazon S3"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34,<2.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_aws_s3_connector*"]
